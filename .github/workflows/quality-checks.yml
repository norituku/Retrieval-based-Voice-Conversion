name: Code Quality Checks

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install quality tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort mypy bandit safety

    - name: Run Black code formatter check
      run: |
        black --check --diff . || echo "Code formatting issues found"
      continue-on-error: true

    - name: Run isort import sorting check
      run: |
        isort --check-only --diff . || echo "Import sorting issues found"
      continue-on-error: true

    - name: Run flake8 linting
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || echo "Critical linting issues found"
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics || echo "Style issues found"
      continue-on-error: true

    - name: Run mypy type checking
      run: |
        mypy voice_converter_enhanced_cli.py --ignore-missing-imports || echo "Type checking issues found"
        mypy integration_tester.py --ignore-missing-imports || echo "Type checking issues found"
        mypy performance_tester.py --ignore-missing-imports || echo "Type checking issues found"
      continue-on-error: true

    - name: Check for security vulnerabilities
      run: |
        bandit -r . -f json -o bandit-results.json || echo "Security issues found"
        cat bandit-results.json || echo "No bandit results file"

    - name: Check dependencies for known vulnerabilities
      run: |
        safety check || echo "Dependency vulnerabilities found"

    - name: Upload quality results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: code-quality-results
        path: |
          bandit-results.json