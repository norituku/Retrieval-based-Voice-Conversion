<?xml version="1.0" encoding="UTF-8"?>
<svg width="500" height="300" viewBox="0 0 500 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="500" height="300" fill="url(#bgGradient)"/>
  
  <!-- 装飾ライン -->
  <line x1="0" y1="50" x2="500" y2="50" stroke="#dee2e6" stroke-width="1"/>
  <line x1="0" y1="250" x2="500" y2="250" stroke="#dee2e6" stroke-width="1"/>
  
  <!-- 中央テキスト -->
  <text x="250" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#495057">RVC Voice Converter</text>
  
  <!-- インストール指示 -->
  <text x="250" y="275" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#6c757d">Drag the app to Applications folder to install</text>
  
  <!-- 装飾エレメント -->
  <circle cx="50" cy="150" r="20" fill="#007acc" opacity="0.3"/>
  <circle cx="450" cy="150" r="20" fill="#4CAF50" opacity="0.3"/>
</svg>